<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tafelvoetbal</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            max-width: 48rem;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.5;
            color: #111;
        }
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 2rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #e5e5e5;
        }
        h1 { margin: 0 0 1.5rem; font-size: 1.5rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        th {
            text-align: left;
            padding: 0.5rem 0.75rem;
            border-bottom: 2px solid #111;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        td { padding: 0.6rem 0.75rem; border-bottom: 1px solid #eee; }
        tr:last-child td { border-bottom: none; }
        .rank { color: #888; width: 2rem; }
        .empty { color: #888; font-style: italic; padding: 1.5rem 0; }
        .header-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.5rem; }
        h1 { margin: 0; font-size: 1.5rem; }
        .btn {
            padding: 0.5rem 1.1rem;
            background: #111;
            color: #fff;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn:hover { background: #333; }
    </style>
</head>

<body>
    <div class="user-bar">
        <span>Signed in as <strong>{{ user.name }}</strong></span>
        <a href="/auth/logout">Sign out</a>
    </div>

    <div class="header-row">
        <h1>Leaderboard</h1>
        <a class="btn" href="/new-game">+ New game</a>
    </div>

    {% if players %}
    <table>
        <thead>
            <tr>
                <th class="rank">#</th>
                <th>Player</th>
                <th>W</th>
                <th>L</th>
                <th>Win %</th>
                <th>Elo</th>
            </tr>
        </thead>
        <tbody>
            {% for player in players %}
            <tr>
                <td class="rank">{{ loop.index }}</td>
                <td>{{ player.name }}</td>
                <td>{{ player.wins }}</td>
                <td>{{ player.losses }}</td>
                <td>{{ player.score }}%</td>
                <td>{{ player.elo }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p class="empty">No games played yet.</p>
    {% endif %}
</body>

</html>
