[project]
name = "tafelvoetbal-app"
version = "0.1.0"
description = "Foosball score tracker and leaderboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "uvicorn[standard]>=0.49.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
